<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>preferFeed fielding status</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f6f6f4;
  --surface-1: #fcfcfb;
  --border: #dedcd5;
  --grid: #ebe9e3;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #6f6e69;
  --accent: #2a78d6;
  --s-done: #2a78d6;
  --s-cancelled: #eb6834;
  --s-incomplete: #1baf7a;
  --warn-bg: #fff4d6;
  --warn-text: #5c4300;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --ink-on-fill: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #383835;
    --grid: #2a2a28;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #9a998f;
    --accent: #3987e5;
    --s-done: #3987e5;
    --s-cancelled: #d95926;
    --s-incomplete: #199e70;
    --warn-bg: #3a2f10;
    --warn-text: #f5dc9a;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #383835;
  --grid: #2a2a28;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #9a998f;
  --accent: #3987e5;
  --s-done: #3987e5;
  --s-cancelled: #d95926;
  --s-incomplete: #199e70;
  --warn-bg: #3a2f10;
  --warn-text: #f5dc9a;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { font-size: 22px; margin: 0; display: inline; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sub { color: var(--text-secondary); margin: 6px 0 0; font-size: 14px; }
.pulls { color: var(--text-secondary); font-size: 13px; margin: 6px 0 0; }
.pulls span { white-space: nowrap; margin-right: 12px; }
.pulls .failed { color: var(--warn-text); background: var(--warn-bg); padding: 0 4px; border-radius: 3px; }
.warn { background: var(--warn-bg); color: var(--warn-text); padding: 8px 12px; border-radius: 6px; margin-top: 10px; }
details.info { margin-top: 10px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; }
details.info summary { cursor: pointer; padding: 8px 12px; color: var(--text-secondary); font-size: 14px; }
details.info summary::marker { content: ""; }
details.info summary .i { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor;
  align-items: center; justify-content: center; font: 600 12px/1 Georgia, serif; margin-right: 6px; }
details.info .body { padding: 0 16px 12px; font-size: 14px; color: var(--text-secondary); }
details.info .body li { margin: 4px 0; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 18px 0 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-1); color: var(--text-primary); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button.nodata { color: var(--text-muted); }
.seg button.nodata[aria-pressed="true"] { color: #fff; }
.refresh { display: inline-flex; gap: 10px; align-items: center; font-size: 14px; color: var(--text-secondary); }
.refresh button { font: inherit; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.range2 { margin-top: 14px; }
.range2 .labels { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; flex-wrap: wrap; }
.range2 .labels b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.track2 { position: relative; height: 6px; margin: 14px 11px 18px; background: var(--grid); border-radius: 3px; touch-action: none; cursor: pointer; }
.track2::before { content: ""; position: absolute; inset: -12px -11px; }
.band2 { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; pointer-events: none; }
.thumb2 { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--surface-1);
  border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: grab; touch-action: none; }
.thumb2.drag { cursor: grabbing; }
.thumb2:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { margin-top: 18px; }
.panel > h2 { font-size: 16px; margin: 0 0 2px; }
.pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; font-size: 14px; color: var(--text-secondary); }
.pager button { font: inherit; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); cursor: pointer; min-height: 32px; }
.pager button[disabled] { opacity: .4; cursor: default; }
.pager .dots { display: inline-flex; gap: 4px; }
.pager .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--text-muted); background: transparent; padding: 0; min-height: 0; }
.pager .dot[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
.page-title { font-size: 15px; font-weight: 600; margin: 4px 0 0; color: var(--text-primary); }
.page-title .group { font-weight: 400; color: var(--text-muted); }
.caption { font-size: 13px; color: var(--text-secondary); margin: 6px 0 0; }
.how { font-size: 13px; color: var(--text-muted); margin: 4px 0 0; }
.cov { font-size: 12px; color: var(--warn-text); background: var(--warn-bg); border-radius: 4px; padding: 3px 8px; margin: 6px 0 0; display: inline-block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 16px; }
.small-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 4px 0 0; display: flex; align-items: center; gap: 6px; }
.ibtn { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text-muted); color: var(--text-muted); background: transparent;
  align-items: center; justify-content: center; font: 700 11px/1 Georgia, serif; padding: 0; cursor: pointer; flex: none; }
.ibtn:hover, .ibtn:focus-visible, .ibtn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.pop { position: fixed; z-index: 20; max-width: 320px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.postcard { position: fixed; z-index: 30; width: min(460px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow: auto; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.postcard .hd { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; color: var(--text-secondary); }
.postcard .post { border-top: 1px solid var(--grid); padding: 6px 0; }
.postcard .vec { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.postcard .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.postcard .warn { font-size: 12px; margin: 4px 0; }
@media (max-width: 560px) { .postcard { left: 12px !important; right: 12px; top: auto !important; bottom: 12px; width: auto; max-height: 55vh; } }
.userbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 6px 0; font-size: 14px; color: var(--text-secondary); }
.userbar input, .userbar button { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
.userbar button { cursor: pointer; min-height: 30px; }
.userbar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.userbar button[disabled] { opacity: .4; cursor: default; }
.userbar input { width: 7ch; }
.userbar select { font: inherit; max-width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
.flowlabel { font-size: 11px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .note { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-muted); font-size: 12px; }
.chart svg .t-ink { fill: var(--text-primary); }
.chart svg .t-sec { fill: var(--text-secondary); }
.tip { position: absolute; pointer-events: none; background: var(--surface-0); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; font-size: 13px; color: var(--text-primary); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; }
.tip .muted { color: var(--text-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--text-secondary); margin: 8px 0 4px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.group td { font-weight: 600; }
tr.sub td:first-child { padding-left: 26px; color: var(--text-secondary); }
tr.sub2 td:first-child { padding-left: 46px; color: var(--text-secondary); }
tr.sub3 td:first-child { padding-left: 66px; color: var(--text-muted); }
tr.sub3 td { font-size: 13px; }
tr.total td { font-weight: 600; border-bottom: 0; }
.bar-cell { width: 28%; }
.minibar { height: 8px; border-radius: 0 4px 4px 0; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.empty { padding: 28px 8px; text-align: center; color: var(--text-secondary); }
footer { margin-top: 24px; font-size: 12px; color: var(--text-muted); }
a { color: var(--accent); }
@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; }
  .bar-cell { display: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="title-row"><h1>preferFeed fielding status</h1></div>
    <p class="sub" id="sub">Loading...</p>
    <p class="pulls" id="pulls"></p>
    <div id="warn"></div>
    <details class="info" id="info">
      <summary><span class="i" aria-hidden="true">i</span>About the data</summary>
      <div class="body" id="info-body"></div>
    </details>
  </header>

  <div class="controls">
    <div class="seg" id="country" role="group" aria-label="Country"></div>
    <div class="refresh">
      <button id="refresh" type="button">Refresh</button>
      <label><input type="checkbox" id="auto"> auto-refresh every <span id="refresh-min">2</span> min</label>
    </div>
  </div>

  <section class="card" id="top">
    <h2 id="c1-title">Participants since launch</h2>
    <p class="note" id="c1-note"></p>
    <div class="chart" id="c1"><div class="tip" id="tip1"></div></div>
    <div class="range2" id="range2">
      <div class="labels"><span>From <b id="from-out"></b></span><span>To <b id="to-out"></b></span></div>
      <div id="slider"></div>
    </div>
  </section>

  <div id="panels"></div>

  <footer id="footer"></footer>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
